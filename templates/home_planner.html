{% extends "base.html" %}
{% block title %}Home Planner{% endblock %}
{% block content %}
<div class="planner-box">
  <h2>🏠 Home Interior Budget Planner</h2>
  <p class="muted">Tell us your budget and requirements — our AI will plan it for you.</p>
  <form id="homeForm" class="form">
    <label>Total Budget (INR) <input type="number" name="total_budget" required min="1000" value="50000"></label>
    <label>Room Type
      <select name="room_type">
        <option>Living Room</option><option>Bedroom</option><option>Kitchen</option>
        <option>Dining Room</option><option>Kids Room</option>
      </select>
    </label>
    <div class="row-3">
      <label>Lights <input type="number" name="num_lights" value="4" min="0"></label>
      <label>Fans <input type="number" name="num_fans" value="2" min="0"></label>
      <label>Furniture <input type="number" name="num_furniture" value="3" min="0"></label>
    </div>
    <label>Dining Tables <input type="number" name="num_dining_tables" value="1" min="0"></label>
    <button type="submit" class="btn btn-primary btn-block">Generate Recommendations ✨</button>
    <p id="msg" class="msg"></p>
  </form>
</div>
<div id="results"></div>
<script>
document.getElementById('homeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '🤖 AI is planning your budget…'; msg.style.color = '#555';
  const fd = new FormData(e.target);
  const payload = {
    total_budget: parseFloat(fd.get('total_budget')),
    room_type: fd.get('room_type'),
    num_lights: parseInt(fd.get('num_lights')),
    num_fans: parseInt(fd.get('num_fans')),
    num_furniture: parseInt(fd.get('num_furniture')),
    num_dining_tables: parseInt(fd.get('num_dining_tables')),
  };
  try {
    const r = await fetch('/generate-home', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!r.ok) throw new Error('Failed. Are you logged in?');
    renderHome(await r.json());
    msg.textContent = '✅ Done!'; msg.style.color = 'green';
  } catch (err) { msg.textContent = '❌ ' + err.message; msg.style.color = 'red'; }
});
function renderHome(d) {
  let html = `<div class="results-box"><h2>🏠 Home Recommendations</h2>
    <p><strong>Total:</strong> ₹${d.total_budget.toFixed(2)} · <strong>Remaining:</strong> ₹${(d.remaining_budget||0).toFixed(2)}</p>`;
  (d.budget_breakdown||[]).forEach(cat => {
    html += `<div class="cat-block"><h3>${cat.category} — ₹${cat.allocation.toFixed(2)}</h3>`;
    (cat.items||[]).forEach(it => {
      html += `<div class="item-card"><h4>${it.name} × ${it.quantity}</h4>
        <p>${it.description}</p><p><strong>≈ ₹${it.estimated_price.toFixed(2)} each</strong></p>
        ${linksHtml(it.shopping_links)}</div>`;
    });
    html += `</div>`;
  });
  if (d.styling_tips?.length) {
    html += `<div class="tips"><h3>💡 Styling Tips</h3><ul>`;
    d.styling_tips.forEach(t => html += `<li>${t}</li>`);
    html += `</ul></div>`;
  }
  html += `</div>`;
  document.getElementById('results').innerHTML = html;
}
function linksHtml(links) {
  if (!links) return '';
  let out = '<div class="links">';
  for (const [k, v] of Object.entries(links))
    out += `<a href="${v}" target="_blank" rel="noopener" class="link-pill">${k} →</a>`;
  return out + '</div>';
}
</script>
{% endblock %}
